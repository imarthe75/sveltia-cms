    .input {$count :integer}
    .match $count
      0   {{ No se escribió ningún carácter. Mínimo: {$min}. Máximo: {$max}. }}
      one {{ {$count} carácter escrito. Mínimo: {$min}. Máximo: {$max}. }}
      *   {{ {$count} caracteres escritos. Mínimo: {$min}. Máximo: {$max}. }}
  # {$count} is the current character count and {$min} is the minimum allowed count
  min: |
    .input {$count :integer}
    .match $count
      0   {{ No se escribió ningún carácter. Mínimo: {$min}. }}
      one {{ {$count} carácter escrito. Mínimo: {$min}. }}
      *   {{ {$count} caracteres escritos. Mínimo: {$min}. }}
  # {$count} is the current character count and {$max} is the maximum allowed count
  max: |
    .input {$count :integer}
    .match $count
      0   {{ No se escribió ningún carácter. Máximo: {$max}. }}
      one {{ {$count} carácter escrito. Máximo: {$max}. }}
      *   {{ {$count} caracteres escritos. Máximo: {$max}. }}

