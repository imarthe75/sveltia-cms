  too_short: |
    .input {$min :integer}
    .match $min
      one {{ Debes escribir al menos {$min} carácter. }}
      *   {{ Debes escribir al menos {$min} caracteres. }}
  too_long: |
    .input {$max :integer}
    .match $max
      one {{ No puedes escribir más de {$max} carácter. }}
      *   {{ No puedes escribir más de {$max} caracteres. }}

