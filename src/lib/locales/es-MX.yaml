# ==============================================================================
# Configuration Validation
# ==============================================================================
# Error and warning messages for CMS configuration validation.

config:
  # Error count notice on entrance page
  # {$count} is the number of configuration errors found
  errors: |
    .input {$count :integer}
    .match $count
      one {{ Hay un error en la configuración del CMS. Resuélvelo e inténtalo de nuevo. }}
      *   {{ Hay errores en la configuración del CMS. Resuélvelos e inténtalo de nuevo. }}

  # Error location prefixes
  error_locator:
    # {$collection}, {$file}, {$component}, and {$field} are the offending config item names
    collection: 'colección {$collection}'
    file: 'archivo {$file}'
    component: 'componente {$component}'
    # Don’t localize `{$field}`
    field: 'campo `{$field}`'

  # Configuration error messages
  error:
    no_secure_context: Sveltia CMS solo funciona con URL HTTPS o direcciones de localhost.
    # {$count} is the number of insecure configuration file URLs
    insecure_urls: |
      .input {$count :integer}
      .match $count
        one {{ La URL del archivo de configuración debe usar el protocolo HTTPS o una dirección de localhost. }}
        *   {{ Las URL de los archivos de configuración deben usar el protocolo HTTPS o direcciones de localhost. }}
    fetch_failed: No se pudo obtener el archivo de configuración.
    # {$status} is the HTTP status code returned while fetching the config file
    fetch_failed_not_ok: La respuesta HTTP devolvió el estado {$status}.
    # Don’t localize `config.yml`, `load_config_file: false`, and `CMS.init()`
    fetch_failed_with_manual_init: 'No se pudo obtener el archivo de configuración. Para evitar que se cargue el archivo `config.yml`, agrega <a>`load_config_file: false`</a> al objeto de configuración que se pasa a `CMS.init()`.'
    parse_failed: No se pudo analizar el archivo de configuración.
    parse_failed_invalid_object: El archivo de configuración no es un objeto de JavaScript válido.
    parse_failed_unsupported_type: El archivo de configuración no es de un tipo válido. Solo se admiten YAML, TOML y JSON.
    no_collection: No se definieron colecciones.
    # Don’t localize `hide`
    no_visible_collection: Al menos una colección debe estar visible. Revisa la opción `hide`.
    missing_backend: No se definió el backend.
    missing_backend_name: No se definió el nombre del backend.
    # {$name} is the backend name from the CMS configuration
    unsupported_known_backend: Sveltia CMS <a>no admite</a> el backend {$name}.
    # {$name} is the backend name from the CMS configuration
    unsupported_deprecated_backend: Sveltia CMS <a>no admite</a> el backend obsoleto {$name}.
    unsupported_custom_backend: Sveltia CMS <a>no admite</a> backends personalizados.
    unsupported_backend_suggestion: Usa uno de los <a>backends admitidos</a> en su lugar.
    missing_repository: No se definió el repositorio.
    invalid_repository: El repositorio configurado no es válido. Debe tener el formato “owner/repo”.
    oauth_implicit_flow: Sveltia CMS no admite el método de autenticación configurado (flujo implícito). Usa otro <a>método de autenticación</a>.
    github_pkce_unsupported: Todavía no se admite la autorización PKCE por limitaciones de GitHub. Usa otro <a>método de autenticación</a>.
    oauth_no_app_id: No se definió el ID de la aplicación OAuth.
    # Don’t localize `open_authoring` and `editorial_workflow`
    open_authoring_no_workflow: La opción `open_authoring` requiere el modo de publicación `editorial_workflow`. Consulta la <a>documentación</a> para ver los detalles.
    # Don’t localize `auth_methods`
    no_auth_methods: La opción `auth_methods` debe contener al menos un método.
    missing_media_folder: No se definió la carpeta de medios.
    public_folder_relative_path: La carpeta pública configurada no es válida. Debe ser una ruta absoluta que empiece con “/”.
    public_folder_absolute_url: Sveltia CMS no admite una URL absoluta en la opción de carpeta pública.
    # {$key} is the unsupported key found in the option map; Don’t localize `transformations`, `raster_image` and `svg`
    invalid_transformation_key: La opción `transformations` contiene una clave `{$key}` no admitida. Debe ser `raster_image`, `svg` o un formato de imagen rasterizada admitido.
    # {$key} is the transformation key; Don’t localize `quality`
    invalid_transformation_quality: La opción `quality` de la transformación `{$key}` no es válida. Debe ser un entero entre 0 y 100.
    # {$prop} is either `width` or `height`; {$key} is the transformation key
    invalid_transformation_size: La opción `{$prop}` de la transformación `{$key}` no es válida. Debe ser un entero positivo.
    # {$count} is the 1-based asset collection index in the configuration array. Don’t localize `name`
    missing_asset_collection_name: La colección de recursos {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate asset collection name
    invalid_asset_collection_name: El nombre de colección de recursos `{$name}` no es válido. No debe contener caracteres especiales.
    # {$name} is the duplicate asset collection name
    duplicate_asset_collection_name: Los nombres de las colecciones de recursos deben ser únicos, pero `{$name}` se usa más de una vez.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_no_options: La colección debe tener definida la opción `folder`, `files` o `divider`.
    # Don’t localize `folder`, `files`, and `divider`
    invalid_collection_multiple_options: La colección no puede tener las opciones `folder`, `files` y `divider` a la vez.
    # {$extension} is the file extension and {$format} is the configured content format
    file_format_mismatch: La extensión `{$extension}` no coincide con el formato `{$format}`.
    # {$slug} is the invalid slug template from the configuration; Don’t localize `path` and `slug`
    invalid_slug_slash: La plantilla de slug `{$slug}` no es válida porque no puede contener barras. Para organizar las entradas en subcarpetas, usa la opción `path` en lugar de `slug`.
    # {$name} is the group name from the configuration; Don’t localize `reorder`, `group` and `view_groups`
    invalid_reorder_group: La opción `reorder` hace referencia a un grupo de vista llamado `{$name}`, pero ese grupo no está definido en la opción `view_groups`.
    # {$name} is the field name from the configuration; Don’t localize `sortable_fields`
    invalid_sortable_field: La opción `sortable_fields` hace referencia a un campo llamado `{$name}`, pero ese campo no está definido en la colección.
    # {$name} is the field name from the configuration; Don’t localize `view_groups`
    invalid_view_group_field: La opción `view_groups` hace referencia a un campo llamado `{$name}`, pero ese campo no está definido en la colección.
    # {$name} is the field name from the configuration; Don’t localize `view_filters`
    invalid_view_filter_field: La opción `view_filters` hace referencia a un campo llamado `{$name}`, pero ese campo no está definido en la colección.
    # {$count} is the 1-based view group index in the configuration array; Don’t localize `name`
    missing_view_group_name: El grupo de vista {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate view group name
    invalid_view_group_name: El nombre de grupo de vista `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_view_group_name: Los nombres de los grupos de vista deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based view filter index in the configuration array; Don’t localize `name`
    missing_view_filter_name: El filtro de vista {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate view filter name
    invalid_view_filter_name: El nombre de filtro de vista `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_view_filter_name: Los nombres de los filtros de vista deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based collection index in the configuration array; Don’t localize `name`
    missing_collection_name: La colección {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate collection name
    invalid_collection_name: El nombre de colección `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_collection_name: Los nombres de las colecciones deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based file index inside a file collection; Don’t localize `name`
    missing_collection_file_name: El archivo de colección {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate collection file name
    invalid_collection_file_name: El nombre de archivo de colección `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_collection_file_name: Los nombres de los archivos de colección deben ser únicos, pero `{$name}` se usa más de una vez.
    # Don’t localize `fields`
    collection_no_fields: La colección debe tener la opción `fields` definida con al menos un campo.
    # Don’t localize `fields`
    collection_file_no_fields: El archivo de colección debe tener la opción `fields` definida con al menos un campo.
    # Don’t localize `i18n`, `locale` and `file`
    collection_file_i18n_required: El archivo de colección debe tener la opción `i18n` definida si se usa el marcador `locale` en la ruta `file`.
    # {$count} is the 1-based field index in the current fields array; Don’t localize `name`
    missing_field_name: El campo {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate field name
    invalid_field_name: El nombre de campo `{$name}` no es válido. No debe contener caracteres especiales. Si quieres anidar campos, <a>usa campos Object en lugar de notación de punto</a>.
    duplicate_field_name: Los nombres de los campos deben ser únicos, pero `{$name}` se usa más de una vez.
    # {$count} is the 1-based variable type index in the current types array
    missing_variable_type: El tipo variable {$count} debe tener la opción `name` definida como una cadena no vacía.
    # {$name} is the invalid or duplicate variable type name
    invalid_variable_type: El nombre de tipo variable `{$name}` no es válido. No debe contener caracteres especiales.
    duplicate_variable_type: Los nombres de los tipos variables deben ser únicos, pero `{$name}` se usa más de una vez.
    date_field_type: 'Sveltia CMS no admite el tipo de campo Date, que está obsoleto. Usa el tipo DateTime con la opción `type: date` en su lugar.'
    # {$timeZone} is the invalid IANA timezone identifier from the configuration
    invalid_timezone: 'Zona horaria no válida: {$timeZone}. Debe ser un identificador IANA válido, como `America/New_York` o `Asia/Tokyo`.'
    # {$prop} is the deprecated option name and {$newProp} is the supported replacement option
    unsupported_deprecated_option: Sveltia CMS no admite la opción `{$prop}`, que está obsoleta. Usa la opción `{$newProp}` en su lugar.
    # Don’t localize `allow_multiple`, `multiple`, and `false`
    allow_multiple: Sveltia CMS no admite la opción `allow_multiple`. Usa la opción `multiple` en su lugar, cuyo valor predeterminado es `false`.
    # Don’t localize `field`, `fields`, and `types`
    invalid_list_field: El campo List no puede tener las opciones `field`, `fields` y `types` a la vez.
    # {$widget} is the configured widget value of the invalid variable type; Don’t localize `widget` and `object`
    invalid_list_variable_type: El tipo variable del campo List no es válido. La opción `widget` tiene el valor `{$widget}`, pero debe ser `object`.
    # Don’t localize `fields`, and `types`
    invalid_object_field: El campo Object no puede tener las opciones `fields` y `types` a la vez.
    # {$collection}, {$file}, and {$field} are referenced names that could not be resolved
    relation_field_invalid_collection: La colección `{$collection}` referenciada no es válida o no está definida.
    relation_field_invalid_collection_file: El archivo `{$file}` referenciado no es válido o no está definido.
    # Don’t localize `file`
    relation_field_missing_file_name: La opción `file` debe estar definida para una relación con una colección de archivos.
    relation_field_invalid_value_field: El campo de valor `{$field}` referenciado no es válido o no está definido.
    unexpected: Error inesperado

    # Schema validation errors, reported when the configuration doesn’t match the published JSON
    # schema. In all of these, {$option} is a configuration option path such as `backend.name` or
    # `view_filters[0].pattern`, relative to the collection, file or field named before it.
    # {$type} is a value type name from `schema_value_type` below
    schema_invalid_type: 'La opción `{$option}` debe ser {$type}.'
    # {$values} is a list of the values the option accepts
    schema_invalid_enum: 'La opción `{$option}` debe tener uno de estos valores: {$values}.'
    # {$value} is the only value the option accepts
    schema_invalid_const: 'La opción `{$option}` debe ser `{$value}`.'
    schema_invalid_empty_value: 'La opción `{$option}` debe ser una cadena vacía.'
    # {$count} is the exact number of items the option must have
    schema_invalid_item_count: 'La opción `{$option}` debe ser un arreglo de {$count} elementos.'
    schema_invalid_value: 'La opción `{$option}` tiene un valor no válido.'
    schema_missing_option: 'La opción `{$option}` es obligatoria.'
    # {$options} is a list of options, one of which must be defined
    schema_missing_one_of: 'Se requiere una de estas opciones: {$options}.'
    # Value type names used in `schema_invalid_type`, each completing the sentence “The option must
    # be …”
    schema_value_type:
      string: una cadena
      number: un número
      integer: un entero
      boolean: un booleano
      array: un arreglo
      object: un objeto
      'null': vacía

  # Warning messages (logged to console)
  warning:
    oauth_no_app_id: No se definió el ID de la aplicación OAuth. Los usuarios deberán proporcionar un token de acceso para iniciar sesión.
    editorial_workflow_unsupported: Por ahora, el flujo editorial solo se admite con los backends de GitHub y GitLab.
    open_authoring_unsupported_backend: Por ahora, la autoría abierta solo se admite con el backend de GitHub.
    # {$prop} is the unsupported option name that will be ignored
    unsupported_ignored_option: Sveltia CMS no admite la opción `{$prop}`. Se ignorará.
    # Don’t localize `picker_utc`, `input_timezone`, and `output_utc`
    conflicting_timezone_options: Están definidas tanto `picker_utc` como las opciones de zona horaria más recientes (`input_timezone` u `output_utc`). Las opciones nuevas tienen prioridad. Conviene quitar `picker_utc` de tu configuración.
    # Don’t localize `preview_path`
    preview_path_no_date_field: La opción `preview_path` usa etiquetas de fecha y hora, pero la colección no tiene ningún campo DateTime del cual leerlas, así que el enlace de vista previa no se mostrará.
    # {$name} is the field name from the configuration; Don’t localize `preview_path_date_field`
    preview_path_date_field_not_found: La opción `preview_path_date_field` hace referencia a un campo llamado `{$name}`, pero no hay ningún campo DateTime con ese nombre, así que el enlace de vista previa no se mostrará.
    # {$name} is the template tag from the configuration; Don’t localize `preview_path`
    preview_path_field_not_found: La opción `preview_path` hace referencia a `{$name}`, pero ese campo no está definido en la colección, así que el enlace de vista previa no se mostrará.
    # {$option} is an option path from the configuration, such as `filter.Regulation`
    schema_unknown_option: 'La opción `{$option}` no está definida en el esquema de configuración de Sveltia CMS. Se ignorará. Revisa si hay una errata o un error de sintaxis.'

  # Compatibility link appended to unsupported feature messages
  compatibility_link: 'Consulta las notas de compatibilidad para ver los detalles: {$link}'

  # Console tip shown after config load
  schema_tip: Para una mejor experiencia de desarrollo, puedes validar tu archivo de configuración contra el esquema JSON de Sveltia CMS. Consulta {$link} para ver los detalles.

# ==============================================================================
# Local Workflow
# ==============================================================================
# Strings for the Local Workflow feature (local repository support).

local_workflow:
  # Badge text in account button
  indicator: Local
  # Browser compatibility warnings
  unsupported_browser: Tu navegador no admite el flujo de trabajo local. Usa Chrome o Edge en su lugar.
  disabled: El flujo de trabajo local está deshabilitado en tu navegador. <a>Así puedes habilitarlo</a>.

# ==============================================================================
# Editorial Workflow
# ==============================================================================
# Strings for the Editorial Workflow feature (content review process), where
# unpublished entries are stored as pull requests on the Git backend.

# Editorial Workflow board announcement with the number of entries in each column. {$draft},
# {$review} and {$ready} are those numbers. The counts are labelled rather than written as prose,
# because selecting a plural form on three numbers at once would need a variant per combination
viewing_editorial_workflow: 'Ahora estás viendo el tablero del flujo editorial. Borradores: {$draft}. En revisión: {$review}. Listas: {$ready}. Pendientes de eliminación: {$deletion}.'
# Same as above, for an Open Authoring contributor: their board has no Ready column, because only
# a maintainer can publish
viewing_open_authoring_workflow: 'Ahora estás viendo el tablero del flujo editorial. Borradores: {$draft}. En revisión: {$review}. Pendientes de eliminación: {$deletion}.'

# Workflow status names. `drafts` is the plural form used as a column heading,
# while `draft` is the singular form used in the editor’s status button.
status:
  draft: Borrador
  drafts: Borradores
  in_review: En revisión
  ready: Lista
  # A pending removal, which is a status of its own rather than a stage: it has no review to go
  # through, only the deletion itself to carry out or call off
  pending_deletion: Pendiente de eliminación

workflow:
  # Buttons on a pending deletion card, and their confirmation dialogs. The two actions are the
  # reverse of a normal card’s: one calls the removal off, the other carries it out. The card’s own
  # buttons are labelled “Cancel” and “Delete”; the dialog needs the longer form, because it already
  # has a Cancel button of its own
  cancel_deletion: Cancelar la eliminación
  confirm_cancelling_deletion: ¿Seguro que quieres cancelar esta eliminación? La entrada seguirá publicada.
  confirm_completing_deletion: ¿Seguro que quieres eliminar esta entrada? Se quitará de inmediato.
  # Toast notification shown after an entry has been marked for deletion in the entry editor. The
  # entry hasn’t been removed yet, so it doesn’t say “deleted”. The confirmation dialog has already
  # explained that it stays until the deletion is published, so this doesn’t repeat it
  deletion_pending: |
    .input {$count :integer}
    .match $count
      one {{ Entrada marcada para eliminación. }}
      *   {{ {$count} entradas marcadas para eliminación. }}
  # Toast notification shown after the unpublished changes to an entry have been thrown away
  changes_discarded: |
    .input {$count :integer}
    .match $count
      one {{ Se descartaron los cambios. }}
      *   {{ Se descartaron los cambios de {$count} entradas. }}
  # Toast notifications shown while a deletion is being called off, and once that has completed
  cancelling_deletion: Cancelando la eliminación…
  deletion_cancelled: Se canceló la eliminación.
  # Error notification when the deletion could not be cancelled
  cancelling_deletion_failed: No se pudo cancelar la eliminación. Inténtalo de nuevo.
  # Group heading shown above the unpublished entries in the entry list
  unpublished_entries: Entradas sin publicar
  published_entries: Entradas publicadas
  # Editor toolbar: status button label, which drops the prefix on a small screen, and menu
  # aria-label. `status` is one of the `status` strings above.
  entry_status_value: 'Estado: {$status}'
  change_entry_status: Cambiar el estado de la entrada
  # Editor toolbar: progress label while the status is being changed
  changing_status: Cambiando el estado…
  # Workflow page: toast notification shown while the status is being updated after a card is
  # dragged to another column, and once the update has completed
  updating_status: Actualizando el estado…
  status_updated: Se actualizó el estado.
  # Error notification when the status could not be changed
  status_change_failed: No se pudo cambiar el estado. Inténtalo de nuevo.
  # Error notification when the status can’t be changed because the entry is incomplete. Required
  # fields can be left empty while the entry is a draft, but not once it moves on from there
  status_change_blocked: La entrada tiene errores. Corrígelos antes de cambiar el estado.
  # Error notification when an entry can’t be published because it’s incomplete, shown in the entry
  # editor and on the Editorial Workflow page
  publish_blocked: La entrada tiene errores. Corrígelos antes de publicarla.
  # Confirmation dialog shown after an entry has been saved as a draft, offering the next step.
  # Used as both the dialog title and its OK button; the Cancel button reuses the `later` string
  send_for_review: Enviar a revisión
  confirm_sending_for_review: Tus cambios se guardaron como borrador. ¿Quieres enviar la entrada a revisión para que alguien la revise y la publique?
  # Editor toolbar: button shown when the entry is ready to be published
  publish_entry: Publicar la entrada
  # Editor toolbar button label and confirmation dialog title, used instead of “Delete” when the
  # entry has a published version, because only the pending changes are thrown away
  discard_changes: Descartar los cambios
  # Confirmation message shown before deleting a published entry, replacing the direct
  # `confirm_deleting_this_entry` when Editorial Workflow is enabled: the removal goes through
  # review, so it isn’t immediate. Keep the label name in sync with `pending_deletion` below
  confirm_deleting_published_entry: ¿Seguro que quieres eliminar esta entrada? No se quitará hasta que se publique la eliminación. Hasta entonces seguirá en la lista de entradas, marcada como Pendiente de eliminación.
  # Confirmation dialogs shown before deleting an unpublished entry. Deleting closes the pull
  # request instead of committing a deletion to the configured branch. Keep the wording free of
  # Git jargon, as editors are often non-technical.
  # Used when the entry has never been published, so nothing of it is left afterwards
  confirm_deleting_unpublished_entry: Esta entrada todavía no se ha publicado, así que al eliminarla se descartará por completo.
  # Used when the entry updates one that is already live, which stays untouched. The dialog is
  # titled “Discard Changes”, so the wording is about discarding, not deleting
  confirm_discarding_entry_changes: Esta entrada tiene cambios sin publicar. Al descartarlos se restaurará la versión publicada. La entrada en sí no se eliminará.
  # Extra sentence appended to the entry list’s delete confirmation when every selected entry is
  # unpublished. {$count} is the number of selected entries. Keep the wording free of Git jargon.
  deleting_unpublished_note_all: |
    .input {$count :integer}
    .match $count
      one {{ Todavía no se ha publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
      *   {{ Todavía no se han publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
  # Same as above, but for a selection that mixes published and unpublished entries. {$count} is
  # the number of selected entries that are unpublished.
  deleting_unpublished_note_some: |
    .input {$count :integer}
    .match $count
      one {{ Una de ellas todavía no se ha publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
      *   {{ {$count} de ellas todavía no se han publicado, así que tus cambios sin publicar se descartarán. Cualquier versión publicada seguirá publicada. }}
  # Confirmation dialog shown before merging the pull request. Keep the wording free of Git jargon.
  confirm_publishing_entry: ¿Seguro que quieres publicar esta entrada? Tus cambios surtirán efecto de inmediato.
  # Workflow page: toast notifications shown while an entry is being published from a card, and
  # once publishing has completed
  publishing_entry: Publicando la entrada…
  entry_published: Se publicó la entrada.
  # Workflow page: toast notifications shown while an entry is being deleted from a card, and once
  # the deletion has completed
  deleting_entry: Eliminando la entrada…
  discarding_changes: Descartando los cambios…
  entry_deleted: Se eliminó la entrada.
  # Error notification when publishing fails
  publishing_entry_failed: No se pudo publicar la entrada. Inténtalo de nuevo.
  # Workflow page: empty column message
  no_entries: Sin entradas.
  # Workflow page: aria-label for a draggable entry card
  drag_entry: Arrastra para cambiar el estado

# Open Authoring: a contributor without write access to the configured repository works in a fork
# of it, and their changes reach the site through a pull request a maintainer merges
open_authoring:
  # Confirmation dialog shown when the CMS needs to create a fork for the contributor, and the
  # label on its OK button. {$repo} is the repository identifier in owner/repo format
  fork_repository: Bifurcar el repositorio
  fork: Bifurcar
  confirm_forking_repository: Para sugerir cambios en “{$repo}” hay que crear una bifurcación del repositorio en tu cuenta. Tus cambios se guardan en esa bifurcación y alguien del equipo los revisa antes de que se publiquen.
  # Error shown when the user declined the dialog above
  fork_declined: Necesitas una bifurcación del repositorio en tu cuenta para sugerir cambios.
  # Error shown when the fork couldn’t be created. {$repo} is the repository identifier
  fork_failed: No se pudo crear una bifurcación del repositorio “{$repo}” en tu cuenta.
  # Error shown when the CMS couldn’t work out whether the user can write to the repository, e.g.
  # because the API rate limit is exhausted. {$repo} is the repository identifier
  permission_check_failed: No se pudo comprobar tu acceso al repositorio “{$repo}”. Inténtalo de nuevo en un momento.
  # Error shown when the repository can’t be forked, which is the default for a private
  # repository. {$repo} is the repository identifier
  forking_disabled: El repositorio “{$repo}” no permite bifurcaciones. Pide a alguien del equipo que las habilite.
  # Error shown when the user was invited to the repository but hasn’t accepted yet, so they still
  # have no access. {$repo} is the repository identifier
  invitation_pending: Tienes una invitación pendiente al repositorio “{$repo}”. Acéptala en GitHub y vuelve a iniciar sesión.
  # Error shown when the repository is private but the sign-in doesn’t cover private repositories.
  # {$repo} is the repository identifier
  private_repo_scope_required: Tu inicio de sesión no incluye acceso a repositorios privados, así que no se puede leer el repositorio “{$repo}”. Pide a alguien del equipo que revise la configuración de autenticación del CMS.
  # Error shown when a contributor tries to publish an entry, which only a maintainer can do
  publish_unsupported: Solo alguien del equipo puede publicar cambios en este sitio. Marca tu entrada como En revisión y alguien la revisará.
  # Error shown when a change would go straight to the site instead of being reviewed, which a
  # contributor can’t do. It covers media library uploads and deletions, and entry reordering
  direct_commit_unsupported: Este cambio no se puede hacer directamente. Solo se pueden proponer para revisión las modificaciones de entradas.
  # Infobar shown while a contributor is signed in. {$repo} is their fork in owner/repo format
  contributing_via_fork: Tus cambios se guardan en tu bifurcación de este repositorio, en “{$repo}”, y se revisan antes de publicarse.
  view_fork: Ver la bifurcación

# ==============================================================================
# Settings Dialog
# ==============================================================================
# Strings for the settings/preferences dialog and its panels.

# Settings page aria-label
categories: Categorías

# Site Configuration Editor
site_configuration_editor: Editor de la configuración del sitio

# Preferences panels
prefs:
  # API key management feedback messages
  changes:
    api_key_saved: Se guardó la clave de API.
    api_key_removed: Se quitó la clave de API.
    api_key_invalid: La clave de API proporcionada no es válida. Revísala e inténtalo de nuevo.

  # Preferences operation errors
  error:
    permission_denied: Se denegó el acceso al almacenamiento de cookies. Revisa los permisos de tu navegador e inténtalo de nuevo.

  # Appearance panel
  appearance:
    title: Apariencia
    theme: Tema
    select_theme: Seleccionar el tema

  # Theme options
  theme:
    dark: Oscuro
    light: Claro

  # Language panel
  language:
    title: Idioma
    ui_language:
      title: Idioma de la interfaz
      select_language: Seleccionar el idioma

  # Contents panel
  contents:
    title: Contenido
    editor:
      title: Editor
      use_draft_backup:
        switch_label: Hacer copia de seguridad automática de los borradores
      close_on_save:
        switch_label: Cerrar el editor después de guardar un borrador
      close_with_escape:
        switch_label: Cerrar el editor con la tecla Escape

  # Internationalization panel
  i18n:
    title: Internacionalización
    translators:
      default:
        title: Servicio de traducción predeterminado
        select_service: Seleccionar el servicio
      api_keys:
        title: Claves de API de los servicios de traducción
        description: Administra las claves de API de los <a>servicios de traducción</a>.
      # API key input label, e.g., “DeepL Key”
      # {$service} is the translation service name
      field_label: 'Clave de {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Regístrate en <a {$homeHref}>{$service}</a> e ingresa aquí <a {$apiKeyHref}>tu clave de API</a> para traducir rápidamente los campos de texto.

  # Media panel
  media:
    title: Medios
    stock_photos:
      api_keys:
        title: Claves de API de los servicios de fotos de stock
        description: Administra las claves de API de los <a>servicios de fotos de stock</a>.
      # API key input label, e.g., “Unsplash API Key”
      # {$service} is the stock photo service name
      field_label: 'Clave de API de {$service}'
      # Description with embedded links
      # {$service} is the service name; {$homeHref} and {$apiKeyHref} are HTML anchor attributes for the service homepage and API key page
      description: Regístrate en <a {$homeHref}>la API de {$service}</a> e ingresa aquí <a {$apiKeyHref}>tu clave de API</a> para insertar fotos de stock gratuitas en los campos de imagen.
      # Photo credit attribution
      # {$service} is the stock photo service name
      credit: Fotos proporcionadas por {$service}
      no_services: No hay <a>servicios de fotos de stock</a> configurados.
    cloud_storage:
      api_keys:
        title: Claves de API de los servicios de almacenamiento en la nube
        description: Administra las claves de API de los <a>servicios de almacenamiento en la nube</a>.
      # API key input label
      # {$service} is the cloud storage service name
      field_label: 'Clave de API de {$service}'
      no_services: No hay <a>servicios de almacenamiento en la nube</a> configurados.

  # Accessibility panel
  accessibility:
    title: Accesibilidad
    underline_links:
      title: Subrayar los enlaces
      description: Muestra el subrayado de los enlaces en la vista previa de las entradas y en las etiquetas de la interfaz.
      switch_label: Subrayar siempre los enlaces

  # Advanced panel
  advanced:
    title: Avanzado
    beta:
      title: Funciones beta
      description: Habilita algunas funciones beta que pueden ser inestables o no estar traducidas.
      switch_label: Unirme al programa beta
    developer_mode:
      title: Modo de desarrollo
      description: Habilita algunas funciones para desarrolladores, como los registros detallados de consola y los menús contextuales nativos.
      switch_label: Habilitar el modo de desarrollo
    deploy_hook:
      title: Webhook de despliegue
      description: Ingresa la URL de un webhook al que se llamará cuando actives manualmente un despliegue con Publicar cambios. Puedes dejarlo en blanco si usas GitHub Actions.
      # Hook URL input
      url:
        field_label: URL del webhook
        saved: Se guardó la URL del webhook.
        removed: Se quitó la URL del webhook.
      # Authorization header input
      auth:
        field_label: Encabezado de autorización (p. ej., Bearer <token>) (opcional)
        saved: Se guardó el encabezado de autorización.
        removed: Se quitó el encabezado de autorización.
    clear_data:
      title: Borrar datos
      # Clear File Cache button
      file_cache:
        description: Elimina el contenido de los archivos y las miniaturas guardados en caché local para liberar espacio o resolver problemas causados por datos obsoletos.
        button_label: Borrar la caché de archivos
        confirmation: Se eliminarán el contenido de los archivos y las miniaturas guardados en caché local. Tus borradores sin guardar y tu configuración se conservarán, y los datos eliminados se volverán a descargar o generar cuando hagan falta. El CMS se recargará al terminar.
      # Erase All Data button
      all_data:
        description: Elimina todo lo que el CMS guarda en este navegador, incluidos los archivos en caché, los borradores sin guardar y la configuración. No se verá afectado nada de lo que ya esté guardado en tu repositorio.
        button_label: Borrar todos los datos
        confirmation: Se eliminarán todos los datos almacenados en este navegador, incluidos el contenido de los archivos en caché, las miniaturas, los borradores sin guardar, la configuración y la sesión iniciada. Tu repositorio no se verá afectado, pero perderás cualquier cambio que no hayas guardado y tendrás que iniciar sesión de nuevo. El CMS se recargará al terminar.

